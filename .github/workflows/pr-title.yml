name: PR title

# Squash is the only merge method here and squash_merge_commit_title is
# PR_TITLE, so the pull request title is what lands on main verbatim.
#
# This lives outside ci.yml because it needs the `edited` trigger: without it a
# corrected title never re-runs the check. Putting `edited` on ci.yml would
# re-run the whole build, lint, test, and migration matrix on every title tweak.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: read

jobs:
  conventional:
    name: conventional commit
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
