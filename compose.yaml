name: example_project

services:
  db:
    image: postgres:17.6
    environment:
      # The image's own interface, fed from the DB_* names used everywhere else.
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "127.0.0.1:${DB_PORT:?DB_PORT is required}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15

  api:
    build:
      context: ./backend
      dockerfile: dev.Dockerfile
    environment:
      # Port 5432 is the container's own, not DB_PORT, which only says which
      # host port the database is published on.
      DATABASE_URL: postgres://${DB_USER:?DB_USER is required}:${DB_PASSWORD:?DB_PASSWORD is required}@${DB_HOST:?DB_HOST is required}:5432/${DB_NAME:?DB_NAME is required}?sslmode=disable
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      # S3_ENDPOINT is the host's view of storage (localhost:4566), which is what
      # the browser needs. Inside this container localhost is the container
      # itself, so the API reaches Floci by service name. When S3_ENDPOINT is
      # empty (real AWS), ":+" leaves both empty.
      S3_ENDPOINT: ${S3_ENDPOINT:+http://floci:4566}
      S3_PUBLIC_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION:?S3_REGION is required}
      S3_MAX_UPLOAD_BYTES: ${S3_MAX_UPLOAD_BYTES:-5242880}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required}
    ports:
      - "127.0.0.1:${API_PORT:?API_PORT is required}:8080"
    volumes:
      - ./backend:/app
      - go_build_cache:/go/pkg/mod
    depends_on:
      db:
        condition: service_healthy

  floci:
    image: floci/floci:2.1.0@sha256:f5aa8c18302cedb4f2385f5c4e455b3efc77fee6bf7b6e5d1712b2817ba102db
    profiles: ["floci"]
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      FLOCI_STORAGE_MODE: memory
      FLOCI_SERVICES_UI_ENABLED: "false"

volumes:
  db_data:
    name: example_project-postgres-data
  go_build_cache:
