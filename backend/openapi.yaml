components:
  schemas:
    CharacterResponse:
      additionalProperties: false
      properties:
        faction:
          type: string
        force_sensitive:
          type: boolean
        id:
          format: int64
          type: integer
        name:
          type: string
        power_level:
          format: int64
          type: integer
        species:
          type: string
        threat_score:
          format: int64
          type: integer
      required:
        - threat_score
        - id
        - name
        - species
        - faction
        - force_sensitive
        - power_level
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    LivenessOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/LivenessOutputBody.json
          format: uri
          readOnly: true
          type: string
        status:
          examples:
            - ok
          type: string
      required:
        - status
      type: object
info:
  title: Example Project API
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/characters:
    get:
      operationId: list-characters
      parameters:
        - description: Faction to filter by
          explode: false
          in: query
          name: faction
          required: true
          schema:
            description: Faction to filter by
            enum:
              - rebel
              - empire
              - jedi
              - sith
              - neutral
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/CharacterResponse"
                type:
                  - array
                  - "null"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List characters by faction
      tags:
        - characters
  /health:
    get:
      description: Reports only that the process is running. Never checks dependencies, because a failing liveness probe gets the process killed.
      operationId: health
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Liveness probe
      tags:
        - meta
