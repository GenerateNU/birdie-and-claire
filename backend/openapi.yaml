components:
  schemas:
    AuthOutputBody:
      additionalProperties: false
      properties:
        keys_loaded:
          examples:
            - true
          type: boolean
      required:
        - keys_loaded
      type: object
    CharacterResponse:
      additionalProperties: false
      properties:
        faction:
          type: string
        force_sensitive:
          type: boolean
        id:
          format: int64
          type: integer
        name:
          type: string
        power_level:
          format: int64
          type: integer
        species:
          type: string
        threat_score:
          format: int64
          type: integer
      required:
        - threat_score
        - id
        - name
        - species
        - faction
        - force_sensitive
        - power_level
      type: object
    ConfirmProfilePictureInputBody:
      additionalProperties: false
      properties:
        key:
          description: Upload key returned by the upload-URL endpoint
          type: string
      required:
        - key
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    LivenessOutputBody:
      additionalProperties: false
      properties:
        status:
          examples:
            - ok
          type: string
      required:
        - status
      type: object
    ProfilePictureUploadResponse:
      additionalProperties: false
      properties:
        headers:
          additionalProperties:
            type: string
          type: object
        key:
          type: string
        method:
          type: string
        url:
          type: string
      required:
        - url
        - method
        - headers
        - key
      type: object
    UserResponse:
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        profile_picture_url:
          type:
            - string
            - "null"
      required:
        - id
        - name
        - profile_picture_url
      type: object
  securitySchemes:
    bearer:
      bearerFormat: JWT
      scheme: bearer
      type: http
info:
  title: Example Project API
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/characters:
    get:
      operationId: list-characters
      parameters:
        - description: Faction to filter by
          explode: false
          in: query
          name: faction
          required: true
          schema:
            description: Faction to filter by
            enum:
              - rebel
              - empire
              - jedi
              - sith
              - neutral
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/CharacterResponse"
                type:
                  - array
                  - "null"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: List characters by faction
      tags:
        - characters
  /api/v1/users/{id}:
    get:
      operationId: get-user
      parameters:
        - description: User ID
          in: path
          name: id
          required: true
          schema:
            description: User ID
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Get a user
      tags:
        - users
  /api/v1/users/{id}/profile-picture/confirm:
    post:
      operationId: confirm-user-profile-picture
      parameters:
        - description: User ID
          in: path
          name: id
          required: true
          schema:
            description: User ID
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmProfilePictureInputBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Confirm a profile picture upload
      tags:
        - users
  /api/v1/users/{id}/profile-picture/upload:
    get:
      operationId: create-user-profile-picture-upload-url
      parameters:
        - description: User ID
          in: path
          name: id
          required: true
          schema:
            description: User ID
            type: string
        - description: MIME type of the image to upload
          explode: false
          in: query
          name: content_type
          required: true
          schema:
            description: MIME type of the image to upload
            enum:
              - image/jpeg
              - image/png
              - image/webp
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfilePictureUploadResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Get a presigned URL to upload a profile picture
      tags:
        - users
  /health:
    get:
      description: Reports only that the process is running. Never checks dependencies, because a failing liveness probe gets the process killed.
      operationId: health
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Liveness probe
      tags:
        - meta
  /health/auth:
    get:
      description: Reports whether Supabase's signing keys are loaded. While keys_loaded is false, every /api/v1 request is rejected. Always 200, so it informs without failing a probe.
      operationId: health-auth
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Token verifier status
      tags:
        - meta
  /health/supabase:
    get:
      description: Fetches the Supabase project's public JWKS document and returns it. Separate from /health because a liveness probe must not fail on a dependency.
      operationId: health-supabase
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Supabase reachability check
      tags:
        - meta
