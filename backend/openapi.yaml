components:
  schemas:
    AuthOutputBody:
      additionalProperties: false
      properties:
        keys_loaded:
          examples:
            - true
          type: boolean
      required:
        - keys_loaded
      type: object
    ConfirmProfilePictureInputBody:
      additionalProperties: false
      properties:
        key:
          description: Upload key returned by the upload-URL endpoint
          type: string
      required:
        - key
      type: object
    CreateOutfitInputBody:
      additionalProperties: false
      properties:
        name:
          description: Display name for the outfit
          maxLength: 100
          minLength: 1
          type: string
        product_ids:
          description: IDs of the products in the outfit
          items:
            type: string
          minItems: 1
          type: array
      required:
        - name
        - product_ids
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    LivenessOutputBody:
      additionalProperties: false
      properties:
        status:
          examples:
            - ok
          type: string
      required:
        - status
      type: object
    OutfitResponse:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        id:
          type: string
        name:
          type: string
        products:
          items:
            $ref: "#/components/schemas/Product"
          type: array
        updated_at:
          format: date-time
          type: string
        user_id:
          type: string
      required:
        - products
        - id
        - user_id
        - name
        - created_at
        - updated_at
      type: object
    Product:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        handle:
          type: string
        id:
          type: string
        product_type:
          type:
            - string
            - "null"
        shopify_id:
          format: int64
          type: integer
        tags:
          items:
            type: string
          type: array
        title:
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - shopify_id
        - handle
        - title
        - product_type
        - tags
        - created_at
        - updated_at
      type: object
    ProductImageResponse:
      additionalProperties: false
      properties:
        alt_text:
          type:
            - string
            - "null"
        created_at:
          format: date-time
          type: string
        height:
          format: int64
          type:
            - integer
            - "null"
        id:
          type: string
        position:
          format: int64
          type: integer
        updated_at:
          format: date-time
          type: string
        url:
          type: string
        width:
          format: int64
          type:
            - integer
            - "null"
      required:
        - id
        - url
        - alt_text
        - width
        - height
        - position
        - created_at
        - updated_at
      type: object
    ProfilePictureUploadResponse:
      additionalProperties: false
      properties:
        headers:
          additionalProperties:
            type: string
          type: object
        key:
          type: string
        method:
          type: string
        url:
          type: string
      required:
        - url
        - method
        - headers
        - key
      type: object
    UserResponse:
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        profile_picture_url:
          type:
            - string
            - "null"
      required:
        - id
        - name
        - profile_picture_url
      type: object
    WarmOutputBody:
      additionalProperties: false
      properties:
        elapsed_ms:
          examples:
            - 41250
          format: int64
          type: integer
        warm:
          examples:
            - true
          type: boolean
      required:
        - warm
        - elapsed_ms
      type: object
  securitySchemes:
    bearer:
      bearerFormat: JWT
      scheme: bearer
      type: http
info:
  title: Birdie & Claire API
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/embedder/warm:
    post:
      description: "Boots a Modal container ahead of an embed call and reports how long it took: tens of seconds on a cold start, well under one when a container is already up. Modal keeps the container warm for about 60 seconds."
      operationId: warm-embedder
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarmOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Warm the embedding service
      tags:
        - embedder
  /api/v1/outfits:
    post:
      operationId: create-outfit
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOutfitInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutfitResponse"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Create an outfit
      tags:
        - outfits
  /api/v1/outfits/{id}:
    get:
      operationId: get-outfit
      parameters:
        - description: Outfit ID
          in: path
          name: id
          required: true
          schema:
            description: Outfit ID
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutfitResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Get an outfit with its products
      tags:
        - outfits
  /api/v1/products/{product_id}/images:
    get:
      operationId: list-product-images
      parameters:
        - description: Product ID
          in: path
          name: product_id
          required: true
          schema:
            description: Product ID
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/ProductImageResponse"
                type:
                  - array
                  - "null"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: List a product's images
      tags:
        - products
  /api/v1/users/me/profile-picture/confirm:
    post:
      operationId: confirm-user-profile-picture
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmProfilePictureInputBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Confirm the caller's profile picture upload
      tags:
        - users
  /api/v1/users/me/profile-picture/upload:
    get:
      operationId: create-user-profile-picture-upload-url
      parameters:
        - description: MIME type of the image to upload
          explode: false
          in: query
          name: content_type
          required: true
          schema:
            description: MIME type of the image to upload
            enum:
              - image/jpeg
              - image/png
              - image/webp
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfilePictureUploadResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Get a presigned URL to upload the caller's profile picture
      tags:
        - users
  /api/v1/users/{id}:
    get:
      operationId: get-user
      parameters:
        - description: User ID
          in: path
          name: id
          required: true
          schema:
            description: User ID
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Get a user
      tags:
        - users
  /health:
    get:
      description: Reports only that the process is running. Never checks dependencies, because a failing liveness probe gets the process killed.
      operationId: health
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Liveness probe
      tags:
        - meta
  /health/auth:
    get:
      description: Reports whether Supabase's signing keys are loaded. While keys_loaded is false, every /api/v1 request is rejected. Always 200, so it informs without failing a probe.
      operationId: health-auth
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Token verifier status
      tags:
        - meta
  /health/supabase:
    get:
      description: Fetches the Supabase project's public JWKS document and returns it. Separate from /health because a liveness probe must not fail on a dependency.
      operationId: health-supabase
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Supabase reachability check
      tags:
        - meta
